<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>해외주식 양도소득세</title>

  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --success: #059669;
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 45%, #ffffff 100%);
      min-height: 100vh;
    }

    .container {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 5vw, 44px);
      letter-spacing: -0.04em;
      color: #0f172a;
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(320px, 0.95fr);
      gap: 22px;
      align-items: start;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(229, 231, 235, 0.8);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 24px;
    }

    .card h2 {
      margin: 0 0 18px;
      font-size: 20px;
      letter-spacing: -0.02em;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-weight: 700;
      font-size: 13px;
      color: #374151;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px 14px;
      font-size: 15px;
      color: var(--text);
      background: #fbfdff;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    textarea {
      min-height: 78px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: rgba(37, 99, 235, 0.65);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.11);
      background: #ffffff;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 13px 16px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.12s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      flex: 1;
      min-width: 160px;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-ghost {
      background: #eef2ff;
      color: #3730a3;
    }

    .btn-danger {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .summary-card {
      position: sticky;
      top: 18px;
    }

    .tax-highlight {
      padding: 20px;
      border-radius: 20px;
      background: linear-gradient(135deg, #1e40af, #2563eb);
      color: white;
      margin-bottom: 18px;
    }

    .tax-highlight span {
      display: block;
      font-size: 13px;
      opacity: 0.85;
      margin-bottom: 8px;
    }

    .tax-highlight strong {
      display: block;
      font-size: clamp(30px, 6vw, 42px);
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .result-list {
      display: grid;
      gap: 10px;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
    }

    .result-row:last-child {
      border-bottom: 0;
    }

    .result-row .label {
      color: var(--muted);
      font-size: 14px;
    }

    .result-row .value {
      font-weight: 800;
      text-align: right;
      white-space: nowrap;
    }

    .positive {
      color: var(--success);
    }

    .negative {
      color: var(--danger);
    }

    .neutral {
      color: #334155;
    }

    .stock-list {
      margin-top: 22px;
    }

    .empty {
      padding: 28px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed #cbd5e1;
      border-radius: 18px;
      background: #f8fafc;
    }

    .stock-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #fbfdff;
      margin-bottom: 12px;
    }

    .stock-name {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 900;
      color: #111827;
    }

    .stock-meta {
      display: flex;
      gap: 10px 16px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .stock-profit {
      margin-top: 10px;
      font-weight: 900;
    }

    .memo {
      margin-top: 10px;
      color: #4b5563;
      font-size: 14px;
      word-break: break-word;
    }

    .notice {
      margin-top: 22px;
      background: #fffbeb;
      color: #78350f;
      border: 1px solid #fde68a;
      border-radius: 22px;
      padding: 20px;
      line-height: 1.65;
      font-size: 14px;
    }

    .notice p {
      margin: 0;
    }

    .notice p + p {
      margin-top: 8px;
    }

    @media (max-width: 860px) {
      .container {
        width: min(100% - 24px, 720px);
        padding: 32px 0;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .summary-card {
        position: static;
      }
    }

    @media (max-width: 560px) {
      .card {
        padding: 18px;
        border-radius: 20px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .stock-item {
        grid-template-columns: 1fr;
      }

      .stock-item .btn-danger {
        width: 100%;
      }

      .result-row {
        align-items: flex-start;
        flex-direction: column;
        gap: 5px;
      }

      .result-row .value {
        text-align: left;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <h1>해외주식 양도소득세</h1>
      <p>연간 실현손익 기준으로 예상 양도소득세를 간단히 계산해보세요.</p>
    </header>

    <section class="grid">
      <div>
        <section class="card">
          <h2>종목 입력</h2>

          <form id="stockForm">
            <div class="form-grid">
              <div class="field full">
                <label for="name">종목명</label>
                <input id="name" type="text" placeholder="예: AAPL, TSLA" autocomplete="off" required />
              </div>

              <div class="field">
                <label for="buyAmount">매수금액</label>
                <input id="buyAmount" type="number" min="0" step="1" placeholder="예: 5000000" required />
              </div>

              <div class="field">
                <label for="sellAmount">매도금액</label>
                <input id="sellAmount" type="number" min="0" step="1" placeholder="예: 7500000" required />
              </div>

              <div class="field full">
                <label for="fee">거래수수료</label>
                <input id="fee" type="number" min="0" step="1" placeholder="예: 15000" value="0" required />
              </div>

              <div class="field full">
                <label for="memo">메모</label>
                <textarea id="memo" placeholder="선택 입력"></textarea>
              </div>
            </div>

            <div class="actions">
              <button type="submit" class="btn-primary">종목 추가</button>
              <button type="button" id="resetButton" class="btn-ghost">전체 초기화</button>
            </div>
          </form>
        </section>

        <section class="card stock-list">
          <h2>입력한 종목 목록</h2>
          <div id="stockList"></div>
        </section>
      </div>

      <aside class="card summary-card">
        <h2>계산 결과</h2>

        <div class="tax-highlight">
          <span>예상 양도소득세</span>
          <strong id="mainTax">0원</strong>
        </div>

        <div id="resultList" class="result-list"></div>
      </aside>
    </section>

    <section class="notice">
      <p>
        본 사이트는 참고용입니다. 실제 세금 신고 시에는 증권사 거래내역,
        환율 적용 기준, 수수료, 기타 필요경비, 국세청 신고 기준에 따라 금액이
        달라질 수 있습니다.
      </p>
      <p>
        해외주식 양도소득세는 일반적으로 해당 연도에 실현한 손익을 합산하여
        다음 해 5월에 신고·납부합니다.
      </p>
    </section>
  </main>

  <script>
    /*
      계산 검증 예시

      1. 총 실현손익 2,000,000원
         과세표준 0원
         예상 세금 0원

      2. 총 실현손익 3,000,000원
         과세표준 500,000원
         예상 세금 110,000원

      3. 총 실현손익 -1,000,000원
         과세표준 0원
         예상 세금 0원
    */

    const STORAGE_KEY = "foreignStockTaxCalculatorItems";

    const BASIC_DEDUCTION = 2500000;
    const CAPITAL_GAINS_TAX_RATE = 0.2;
    const LOCAL_INCOME_TAX_RATE = 0.02;
    const TOTAL_TAX_RATE = CAPITAL_GAINS_TAX_RATE + LOCAL_INCOME_TAX_RATE;

    const form = document.getElementById("stockForm");
    const stockList = document.getElementById("stockList");
    const resultList = document.getElementById("resultList");
    const mainTax = document.getElementById("mainTax");
    const resetButton = document.getElementById("resetButton");

    let stocks = loadStocks();

    function loadStocks() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        return saved ? JSON.parse(saved) : [];
      } catch (error) {
        console.error("저장된 데이터를 불러오지 못했습니다.", error);
        return [];
      }
    }

    function saveStocks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(stocks));
    }

    function toNumber(value) {
      const number = Number(value);

      if (!Number.isFinite(number) || number < 0) {
        return 0;
      }

      return Math.floor(number);
    }

    function formatWon(value) {
      const rounded = Math.round(value);
      return `${rounded.toLocaleString("ko-KR")}원`;
    }

    function getValueClass(value) {
      if (value > 0) return "positive";
      if (value < 0) return "negative";
      return "neutral";
    }

    function calculateStockProfit(stock) {
      return stock.sellAmount - stock.buyAmount - stock.fee;
    }

    // 세금 계산 로직
    function calculateTax(items) {
      const totalBuyAmount = items.reduce((sum, item) => sum + item.buyAmount, 0);
      const totalSellAmount = items.reduce((sum, item) => sum + item.sellAmount, 0);
      const totalFee = items.reduce((sum, item) => sum + item.fee, 0);

      const totalProfit = totalSellAmount - totalBuyAmount - totalFee;

      const taxableIncome = Math.max(totalProfit - BASIC_DEDUCTION, 0);
      const capitalGainsTax = taxableIncome * CAPITAL_GAINS_TAX_RATE;
      const localIncomeTax = taxableIncome * LOCAL_INCOME_TAX_RATE;
      const estimatedTax = taxableIncome * TOTAL_TAX_RATE;
      const afterTaxProfit = totalProfit - estimatedTax;

      return {
        totalBuyAmount,
        totalSellAmount,
        totalFee,
        totalProfit,
        basicDeduction: BASIC_DEDUCTION,
        taxableIncome,
        estimatedTax,
        capitalGainsTax,
        localIncomeTax,
        afterTaxProfit
      };
    }

    function renderResults() {
      const result = calculateTax(stocks);

      mainTax.textContent = formatWon(result.estimatedTax);

      const rows = [
        ["총 매수금액", result.totalBuyAmount],
        ["총 매도금액", result.totalSellAmount],
        ["총 거래수수료", result.totalFee],
        ["총 실현손익", result.totalProfit, true],
        ["기본공제", result.basicDeduction],
        ["과세표준", result.taxableIncome],
        ["예상 양도소득세", result.estimatedTax],
        ["양도소득세 20%", result.capitalGainsTax],
        ["지방소득세 2%", result.localIncomeTax],
        ["세후 손익", result.afterTaxProfit, true]
      ];

      resultList.innerHTML = rows.map(([label, value, colorize]) => {
        const valueClass = colorize ? getValueClass(value) : "neutral";

        return `
          <div class="result-row">
            <span class="label">${label}</span>
            <span class="value ${valueClass}">${formatWon(value)}</span>
          </div>
        `;
      }).join("");
    }

    function renderStockList() {
      if (stocks.length === 0) {
        stockList.innerHTML = `
          <div class="empty">
            아직 입력한 종목이 없습니다.
          </div>
        `;
        return;
      }

      stockList.innerHTML = stocks.map((stock) => {
        const profit = calculateStockProfit(stock);

        const memoHtml = stock.memo
          ? `<div class="memo">${escapeHtml(stock.memo)}</div>`
          : "";

        return `
          <article class="stock-item">
            <div>
              <h3 class="stock-name">${escapeHtml(stock.name)}</h3>

              <div class="stock-meta">
                <span>매수 ${formatWon(stock.buyAmount)}</span>
                <span>매도 ${formatWon(stock.sellAmount)}</span>
                <span>수수료 ${formatWon(stock.fee)}</span>
              </div>

              <div class="stock-profit ${getValueClass(profit)}">
                실현손익 ${formatWon(profit)}
              </div>

              ${memoHtml}
            </div>

            <button type="button" class="btn-danger" onclick="deleteStock('${stock.id}')">
              삭제
            </button>
          </article>
        `;
      }).join("");
    }

    function render() {
      renderResults();
      renderStockList();
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function clearForm() {
      form.reset();
      document.getElementById("fee").value = 0;
      document.getElementById("name").focus();
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const buyAmount = toNumber(document.getElementById("buyAmount").value);
      const sellAmount = toNumber(document.getElementById("sellAmount").value);
      const fee = toNumber(document.getElementById("fee").value);
      const memo = document.getElementById("memo").value.trim();

      if (!name) {
        alert("종목명을 입력해주세요.");
        return;
      }

      stocks.push({
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
        name,
        buyAmount,
        sellAmount,
        fee,
        memo
      });

      saveStocks();
      render();
      clearForm();
    });

    // 숫자 입력칸에 e, +, - 입력 방지
    document.querySelectorAll('input[type="number"]').forEach((input) => {
      input.addEventListener("keydown", (event) => {
        if (["e", "E", "+", "-"].includes(event.key)) {
          event.preventDefault();
        }
      });

      input.addEventListener("input", () => {
        if (Number(input.value) < 0) {
          input.value = 0;
        }
      });
    });

    window.deleteStock = function deleteStock(id) {
      stocks = stocks.filter((stock) => stock.id !== id);
      saveStocks();
      render();
    };

    resetButton.addEventListener("click", () => {
      if (!stocks.length) {
        clearForm();
        return;
      }

      const confirmed = confirm("입력한 모든 종목을 초기화할까요?");

      if (!confirmed) return;

      stocks = [];
      saveStocks();
      clearForm();
      render();
    });

    render();
  </script>
</body>
</html>
